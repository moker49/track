{% for month in diary_entries|groupby('month_key') %}
<section class="upcoming-month diary-month" data-diary-month="{{ month.list[0].month_key }}" aria-label="{{ month.list[0].month_label }}">
  <h2>{{ month.list[0].month_label }}</h2>
  <div class="schedule-timeline-list">
    {% for entry in month.list %}
    <article class="schedule-timeline-item diary-timeline-item diary-monthly-timeline-item" data-schedule-card data-show-id="{{ entry.show_id }}">
      <div class="schedule-timeline-marker" aria-hidden="true"><span>{{ entry.month_percent }}%</span></div>
      <span class="schedule-timeline-rail" aria-hidden="true"><span></span></span>
      <div class="schedule-timeline-content">
        <button class="schedule-timeline-open" type="button" data-schedule-show-open aria-label="Open {{ entry.show_name }} details">
          <span class="schedule-timeline-poster{% if entry.poster_path %} has-media-image{% endif %}" aria-hidden="true">
            {% if entry.poster_path %}<img src="{{ url_for('cached_tmdb_image', image_type='poster', size='w185', tmdb_path=entry.poster_path[1:]) }}" alt="" loading="lazy" decoding="async" data-media-image><template data-media-fallback-template><span>{{ entry.show_name[:1]|upper }}</span></template>{% else %}<span>{{ entry.show_name[:1]|upper }}</span>{% endif %}
          </span>
          <span class="schedule-timeline-copy"><strong>{{ entry.show_name }}</strong><span>{{ entry.episode_count }} {{ 'episode' if entry.episode_count == 1 else 'episodes' }}</span></span>
        </button>
      </div>
    </article>
    {% endfor %}
  </div>
</section>
{% endfor %}
