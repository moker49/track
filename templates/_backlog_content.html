{% from "_schedule_timeline_item.html" import schedule_timeline_item %}
<div class="schedule-content" data-schedule-content="backlog">
  <section class="schedule-panel" aria-label="Queue">
    <div class="schedule-timeline-list" data-catch-up-list>
      {% for episode in catch_up_episodes %}{{ schedule_timeline_item(episode, 'catch-up') }}{% endfor %}
    </div>
    <div class="schedule-empty" data-catch-up-empty data-schedule-empty {% if catch_up_episodes %}hidden{% endif %}>
      <span class="material-symbols-rounded" aria-hidden="true">done_all</span>
      <span>You’re caught up</span>
    </div>
    <div class="schedule-empty" data-schedule-no-results hidden>
      <span class="material-symbols-rounded" aria-hidden="true">search_off</span>
      <span>No matching episodes</span>
    </div>
  </section>
</div>
