<div class="schedule-content diary-content" data-diary-content>
  <section class="schedule-panel" aria-label="Diary entries">
    <div class="schedule-timeline">
      {% for month in diary_entries|groupby('month_key') %}
      <section class="upcoming-month diary-month" aria-label="{{ month.list[0].month_label }}">
        <h2>{{ month.list[0].month_label }}</h2>
        <div class="schedule-timeline-list">
          {% for entry in month.list %}
          <article class="schedule-timeline-item diary-timeline-item" data-episode-id="{{ entry.episode_id }}"
            data-watch-record-id="{{ entry.watch_record_id }}">
            <div class="schedule-timeline-marker" aria-hidden="true">
              <strong>{{ entry.day_label }}</strong>
              <span>{{ entry.weekday_label }}</span>
            </div>
            <span class="schedule-timeline-rail" aria-hidden="true"><span></span></span>
            <div class="schedule-timeline-content">
              <button class="schedule-timeline-open" type="button" data-schedule-episode-open
                aria-label="Open Season {{ entry.season_number }}, Episode {{ entry.episode_number }} of {{ entry.show_name }}">
                <span class="schedule-timeline-poster{% if entry.poster_path %} has-media-image{% endif %}"
                  aria-hidden="true">
                  {% if entry.poster_path %}<img src="{{ url_for('cached_tmdb_image', image_type='poster', size='w185', tmdb_path=entry.poster_path[1:]) }}" alt="" loading="lazy" decoding="async" data-media-image><template data-media-fallback-template><span>{{ entry.show_name[:1]|upper }}</span></template>{% else %}<span>{{ entry.show_name[:1]|upper }}</span>{% endif %}
                </span>
                <span class="schedule-timeline-copy">
                  <strong>{{ entry.show_name }}</strong>
                  <span>Season {{ entry.season_number }} · Episode {{ entry.episode_number }}</span>
                </span>
              </button>
            </div>
          </article>
          {% endfor %}
        </div>
      </section>
      {% endfor %}
    </div>
    <div class="schedule-empty" {% if diary_entries %}hidden{% endif %}>
      <span class="material-symbols-rounded" aria-hidden="true">menu_book</span>
      <span>No diary entries</span>
    </div>
  </section>
</div>
