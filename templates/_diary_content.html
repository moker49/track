<div class="schedule-content diary-content" data-diary-content data-diary-page="{{ diary_page }}"
  data-diary-has-more="{{ 'true' if diary_has_more else 'false' }}">
  <section class="schedule-panel" aria-label="Diary entries">
    <div class="schedule-timeline">
      <span class="diary-page-trigger" data-diary-page-trigger="{{ diary_page }}" aria-hidden="true"></span>
      {% include "_diary_months.html" %}
    </div>
    <div class="schedule-empty" {% if diary_entries %}hidden{% endif %}>
      <span class="material-symbols-rounded" aria-hidden="true">menu_book</span>
      <span>No diary entries</span>
    </div>
  </section>
</div>
