{% from "_movie_card.html" import movie_card %}
<section class="page-section tv-library-section" data-state-section="ACTIVE"><div class="show-list" data-movie-list="ACTIVE">{% for movie in active_movies %}{{ movie_card(movie) }}{% endfor %}</div></section>
<section class="page-section tv-library-section archived-section" data-state-section="ARCHIVED" hidden><div class="show-list" data-movie-list="ARCHIVED">{% for movie in archived_movies %}{{ movie_card(movie) }}{% endfor %}</div></section>
<section class="page-section tv-add-section" data-movie-add-section hidden><div class="popular-grid" data-movie-add-results></div></section>
<div class="empty-state tv-search-empty" data-movie-search-empty hidden>
  <span class="empty-icon material-symbols-rounded" aria-hidden="true">search_off</span>
  <h3>No results found</h3>
</div>
<div class="empty-state tv-search-error" data-movie-search-error hidden>
  <span class="empty-icon material-symbols-rounded" aria-hidden="true">cloud_off</span>
  <h3>Couldn’t search TMDB</h3>
  <p data-movie-search-error-copy>Try again.</p>
  <button class="filled-button" type="button" data-movie-search-retry>Try again</button>
</div>
