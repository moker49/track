<header class="top-app-bar search-header">
  <form class="app-bar-search" role="search" data-view-search>
    <span class="material-symbols-rounded" aria-hidden="true">search</span>
    <input type="search" placeholder="Search TMDB" aria-label="Search TMDB" autocomplete="off" data-discover-search>
    <button class="search-clear" type="button" data-clear-search aria-label="Clear search" hidden>
      <span class="material-symbols-rounded" aria-hidden="true">close</span>
    </button>
  </form>
</header>

<section class="page-section search-page">
  <div class="section-heading popular-heading">
    <div>
      <h2 data-discover-title>Popular now</h2>
      <p data-discover-subtitle>Refreshed at most once each day</p>
    </div>
  </div>

  <div class="discover-loading" data-discover-loading aria-label="Loading popular shows" aria-busy="true">
    <span class="discover-loading-bar"></span>
    <span class="discover-loading-bar"></span>
    <span class="discover-loading-bar"></span>
  </div>

  <div class="empty-state" data-discover-error hidden>
    <span class="empty-icon material-symbols-rounded" aria-hidden="true">cloud_off</span>
    <h3>Discover is unavailable</h3>
    <p data-discover-error-copy>Add your TMDB token to connect Discover.</p>
    <button class="filled-button" type="button" data-discover-retry>Try again</button>
  </div>

  <div class="empty-state" data-discover-empty hidden>
    <span class="empty-icon material-symbols-rounded" aria-hidden="true">search_off</span>
    <h3>No shows found</h3>
    <p>Try another title.</p>
  </div>

  <div class="popular-grid" data-discover-results></div>
</section>
