<header class="top-app-bar search-header">
  <form class="app-bar-search" role="search" data-view-search>
    <span class="material-symbols-rounded" aria-hidden="true">search</span>
    <input type="search" placeholder="Search TMDB" aria-label="Search TMDB" autocomplete="off" data-discover-search>
  </form>
</header>

<section class="page-section search-page">
  <div class="search-notice" role="status" data-discover-notice hidden>
    <strong>Search ready for TMDB</strong>
    <p data-discover-copy></p>
  </div>

  <div class="section-heading popular-heading">
    <div>
      <h2>Popular now</h2>
      <p>Shows people are talking about</p>
    </div>
  </div>

  <div class="popular-grid">
    {% for show in popular %}
      <article class="popular-card">
        <div class="mini-poster poster-tone-{{ loop.index }}" aria-hidden="true">
          <span>{{ show.name[0] }}</span>
        </div>
        <div>
          <h3>{{ show.name }}</h3>
          <p>{{ show.subtitle }}</p>
          <button type="button" class="text-button" disabled>View show</button>
        </div>
      </article>
    {% endfor %}
  </div>
</section>
