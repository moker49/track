{% macro show_card(show) %}
{% set percent = ((show.watched_count / show.episode_count * 100)|round|int) if show.episode_count else 0 %}
{% set progress = progress_for(show.state, show.watched_count, show.episode_count, show.status) %}
{% set move = move_for(show.state) %}

<article class="show-card" data-show-id="{{ show.id }}" data-tmdb-id="{{ show.tmdb_id }}"
  data-show-name="{{ show.name|lower }}" data-date-added="{{ show.added_at }}"
  data-release-date="{{ show.first_air_date }}" data-show-state="{{ show.state }}"
  data-show-status="{{ show.status or '' }}"
  data-watched-count="{{ show.watched_count }}" data-episode-count="{{ show.episode_count }}"
  data-progress-state="{{ progress.css_state }}">
  <button class="show-card-open" type="button" data-show-open aria-label="Open {{ show.name }}">
    <div class="poster poster-purple{% if show.poster_path %} has-media-image{% endif %}" aria-hidden="true">
      {% if show.poster_path %}<img class="poster-image"
        src="{{ url_for('cached_tmdb_image', image_type='poster', size='w342', tmdb_path=show.poster_path[1:]) }}"
        alt="" loading="lazy" decoding="async" data-media-image><template data-media-fallback-template><span
          class="poster-mark">{{ show.name[:2]|upper }}</span><span class="poster-label">{{ show.name
          }}</span></template>{% else %}<span class="poster-mark">{{ show.name[:2]|upper }}</span><span
        class="poster-label">{{ show.name }}</span>{% endif %}
    </div>
    <div class="show-card-body">
      <div class="show-card-heading">
        <div class="show-card-meta">
          <span class="state-label progress-tag" data-progress-tag>{{ progress.label }}</span>
        </div>
        <h3>{{ show.name }}</h3>
        <span class="show-card-year">{{ show.first_air_date[:4] }}</span>
      </div>
      <div class="progress-block">
        <div class="progress-copy">
          <span data-card-progress-copy>{{ show.watched_count }} of {{ show.episode_count }}</span>
          <strong>{{ percent }}%</strong>
        </div>
        <div class="progress-track" data-card-progress role="progressbar" aria-valuemin="0" aria-valuemax="100"
          aria-valuenow="{{ percent }}">
          <span style="width: {{ percent }}%"></span>
        </div>
      </div>
    </div>
  </button>
  <button class="icon-button card-menu-button" type="button" data-show-menu-button
    aria-label="More options for {{ show.name }}" aria-expanded="false">
    <span class="material-symbols-rounded" aria-hidden="true">more_vert</span>
  </button>
  <div class="show-menu card-show-menu" data-show-menu hidden>
    <button type="button" data-show-action="move" data-target-state="{{ move.target_state }}">
      <span class="material-symbols-rounded" aria-hidden="true">{{ move.icon }}</span>
      <span data-move-label>{{ move.label }}</span>
    </button>
    <button class="danger-action" type="button" data-show-action="remove">
      <span class="material-symbols-rounded" aria-hidden="true">delete</span>
      <span>Remove</span>
    </button>
  </div>
</article>
{% endmacro %}
