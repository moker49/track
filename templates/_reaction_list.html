{% from "_show_card.html" import show_card %}
{% from "_movie_card.html" import movie_card %}
{% if shows or movies %}
<div class="show-list reaction-media-list">
  {% for show in shows %}{{ show_card(show) }}{% endfor %}
  {% for movie in movies %}{{ movie_card(movie) }}{% endfor %}
</div>
{% else %}
<div class="reaction-empty-state">
  <span class="material-symbols-rounded" aria-hidden="true">favorite</span>
  <p>No media marked Liked yet.</p>
</div>
{% endif %}
