{% extends "base.html" %}
{% block content %}
<header class="top-app-bar global-search-app-bar" data-global-search-bar>
  <button class="icon-button top-bar-action" type="button" data-search-menu aria-label="Menu">
    <span class="material-symbols-rounded" aria-hidden="true">menu</span>
  </button>
  <button class="icon-button top-bar-action" type="button" data-search-back aria-label="Clear search and go back"
    hidden>
    <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
  </button>
  <form class="app-bar-search" role="search" data-view-search>
    <input type="search" placeholder="Search queue" aria-label="Search queue episodes" autocomplete="off"
      data-global-search>
  </form>
  <button class="icon-button top-bar-action" type="button" data-search-profile aria-label="Profile">
    <span class="material-symbols-rounded" aria-hidden="true">account_circle</span>
  </button>
  <button class="icon-button top-bar-action" type="button" data-clear-search aria-label="Clear search" hidden>
    <span class="material-symbols-rounded" aria-hidden="true">close</span>
  </button>
</header>

<section class="app-view is-active" data-view="backlog" aria-label="Queue">
  {% include "_backlog_content.html" %}
</section>

<section class="app-view" data-view="upcoming" aria-label="Upcoming" hidden>
  {% include "_upcoming_content.html" %}
</section>

<section class="app-view" data-view="tv" aria-label="TV" hidden>
  {% include "tv.html" %}
</section>

<section class="app-view" data-view="detail" aria-label="Show details" aria-live="polite" hidden></section>

<template id="detail-loading-template">
  <header class="detail-app-bar">
    <button class="icon-button" type="button" data-detail-back aria-label="Back">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
    </button>
    <span data-detail-loading-title>Details</span>
  </header>
  <div class="detail-loading" role="status" aria-label="Loading details" aria-busy="true">
    <span class="sr-only" data-detail-loading-label>Loading details</span>
  </div>
</template>

<div class="snackbar" role="status" aria-live="polite" hidden>
  <span data-snackbar-copy></span>
  <button type="button" data-snackbar-action hidden></button>
</div>

<dialog class="image-viewer" data-image-viewer aria-label="Image preview">
  <button class="icon-button image-viewer-close" type="button" data-image-viewer-close aria-label="Close image preview">
    <span class="material-symbols-rounded" aria-hidden="true">close</span>
  </button>
  <div class="image-viewer-stage" data-image-viewer-stage aria-busy="true">
    <div class="image-viewer-media" data-image-viewer-media>
      <img class="image-viewer-preview" data-image-viewer-preview alt="">
      <img class="image-viewer-image" data-image-viewer-image alt="">
    </div>
  </div>
</dialog>

<dialog class="confirm-dialog" data-remove-dialog>
  <h2>Remove show?</h2>
  <p>This removes the show from TV. Its metadata and watch history stay saved.</p>
  <div class="dialog-actions">
    <button type="button" data-cancel-remove>Cancel</button>
    <button class="danger-action" type="button" data-confirm-remove>Remove</button>
  </div>
</dialog>

<dialog class="date-picker" data-date-picker aria-labelledby="date-picker-title">
  <div class="date-picker-header">
    <span id="date-picker-title">Select watch date</span>
    <strong data-date-picker-selection>No date set</strong>
  </div>
  <div class="date-picker-calendar">
    <div class="date-picker-month-bar">
      <strong data-date-picker-month></strong>
      <span class="date-picker-month-actions">
        <button class="icon-button" type="button" data-date-picker-previous aria-label="Previous month">
          <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
        </button>
        <button class="icon-button" type="button" data-date-picker-next aria-label="Next month">
          <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
        </button>
      </span>
    </div>
    <div class="date-picker-weekdays" aria-hidden="true">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div class="date-picker-grid" role="grid" data-date-picker-grid></div>
  </div>
  <div class="date-picker-actions">
    <button type="button" data-date-picker-clear>Clear</button>
    <span></span>
    <button type="button" data-date-picker-cancel>Cancel</button>
    <button type="button" data-date-picker-save>OK</button>
  </div>
</dialog>

{% endblock %}
