{% extends "base.html" %}
{% block content %}
  <section class="app-view is-active" data-view="watching" aria-label="Watching">
    {% include "watching.html" %}
  </section>

  <section class="app-view" data-view="archive" aria-label="Archive" hidden>
    {% include "archive.html" %}
  </section>

  <section class="app-view" data-view="discover" aria-label="Discover" hidden>
    {% include "search.html" %}
  </section>

  <section class="app-view" data-view="detail" aria-label="Show details" aria-live="polite" hidden></section>

  <template id="detail-skeleton-template">
    <header class="detail-app-bar">
      <button class="icon-button" type="button" data-detail-back aria-label="Back to Watching">
        <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>
      </button>
      <span>Show details</span>
    </header>
    <div class="detail-skeleton" aria-label="Loading show details" aria-busy="true">
      <div class="skeleton-hero">
        <span class="skeleton-block skeleton-poster"></span>
        <div class="skeleton-copy">
          <span class="skeleton-block skeleton-chip"></span>
          <span class="skeleton-block skeleton-title"></span>
          <span class="skeleton-block skeleton-line short"></span>
        </div>
      </div>
      <div class="skeleton-body">
        <span class="skeleton-block skeleton-line medium"></span>
        <span class="skeleton-block skeleton-line"></span>
        <span class="skeleton-block skeleton-line"></span>
        <span class="skeleton-block skeleton-progress"></span>
        <span class="skeleton-block skeleton-season"></span>
        <span class="skeleton-block skeleton-season"></span>
      </div>
    </div>
  </template>

  <div class="snackbar" role="status" aria-live="polite" hidden></div>

  <dialog class="confirm-dialog" data-remove-dialog>
    <div class="dialog-icon material-symbols-rounded" aria-hidden="true">delete</div>
    <h2>Remove show?</h2>
    <p>This removes the show, its episodes, and all watch history from this device.</p>
    <div class="dialog-actions">
      <button type="button" data-cancel-remove>Cancel</button>
      <button class="danger-action" type="button" data-confirm-remove>Remove</button>
    </div>
  </dialog>
{% endblock %}
