{% macro upcoming_timeline_item(episode) %}
<article class="upcoming-timeline-item" data-schedule-card data-schedule-mode="upcoming"
  data-show-id="{{ episode.show_id }}" data-episode-id="{{ episode.episode_id }}"
  data-schedule-search-text="{{ episode.show_name|lower }} {{ episode.episode_name|lower }}">
  <div class="upcoming-date" aria-hidden="true">
    <strong>{{ episode.day_label }}</strong>
    <span>{{ episode.weekday_label }}</span>
  </div>
  <span class="upcoming-rail" aria-hidden="true"><span></span></span>
  <button class="upcoming-episode-open" type="button" data-schedule-episode-open
    aria-label="Open {{ episode.episode_name }} details">
    <span class="upcoming-poster{% if episode.poster_path %} has-media-image{% endif %}" aria-hidden="true">
      {% if episode.poster_path %}<img src="{{ url_for('cached_tmdb_image', image_type='poster', size='w185', tmdb_path=episode.poster_path[1:]) }}" alt="" loading="lazy" decoding="async" data-media-image><template data-media-fallback-template><span>{{ episode.show_name[:1]|upper }}</span></template>{% else %}<span>{{ episode.show_name[:1]|upper }}</span>{% endif %}
    </span>
    <span class="upcoming-copy">
      <strong>{{ episode.show_name }}</strong>
      <span>Season {{ episode.season_number }} · Episode {{ episode.episode_number }}</span>
      <span class="upcoming-episode-title">{{ episode.episode_name }}</span>
    </span>
    <span class="upcoming-countdown">
      {{ episode.days_until }} {{ 'day' if episode.days_until == 1 else 'days' }}
    </span>
  </button>
</article>
{% endmacro %}
