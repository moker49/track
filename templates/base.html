<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141218">
  <title>{% block title %}Track{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
  <div class="app-shell">
    <main class="app-content">{% block content %}{% endblock %}</main>
    <nav class="bottom-nav" aria-label="Primary navigation">
      <a class="nav-item {{ 'active' if active_nav == 'shows' else '' }}" href="{{ url_for('my_shows') }}" {% if active_nav == 'shows' %}aria-current="page"{% endif %}>
        <span class="nav-icon library-glyph" aria-hidden="true"></span>
        <span>My Shows</span>
      </a>
      <a class="nav-item {{ 'active' if active_nav == 'search' else '' }}" href="{{ url_for('search') }}" {% if active_nav == 'search' %}aria-current="page"{% endif %}>
        <span class="nav-icon" aria-hidden="true">
          <span class="search-glyph"></span>
        </span>
        <span>Discover</span>
      </a>
    </nav>
  </div>
</body>
</html>
