<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141218">
  <title>Track</title>
  <script>
    document.documentElement.classList.add("app-booting");
    window.setTimeout(() => document.documentElement.classList.remove("app-booting"), 4000);
  </script>
  <link rel="preload" href="{{ url_for('static', filename='fonts/material-symbols-rounded.ttf', v=asset_version) }}"
    as="font" type="font/ttf" crossorigin>
  <link rel="preload"
    href="{{ url_for('static', filename='fonts/material-symbols-rounded-filled.ttf', v=asset_version) }}" as="font"
    type="font/ttf" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css', v=asset_version) }}">
  <script src="{{ url_for('static', filename='app.js', v=asset_version) }}" defer></script>
</head>

<body>
  <div class="app-boot-screen" role="status" aria-label="Loading Track">
    <span></span>
  </div>
  <button class="menu-scrim" type="button" data-menu-scrim aria-label="Close menu" hidden></button>
  <div class="app-shell">
    <main class="app-content">{% block content %}{% endblock %}</main>
    <div class="bottom-chrome">
      {% include "_tv_controls.html" %}
      <nav class="bottom-nav" aria-label="Primary navigation">
      <button class="nav-item active" type="button" data-nav-view="backlog" aria-current="page">
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-rounded">resume</span>
        </span>
        <span>Queue</span>
      </button>
      <button class="nav-item" type="button" data-nav-view="upcoming">
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-rounded">event</span>
        </span>
        <span>Upcoming</span>
      </button>
      <button class="nav-item" type="button" data-nav-view="tv">
        <span class="nav-icon" aria-hidden="true">
          <span class="material-symbols-rounded">tv</span>
        </span>
        <span>TV</span>
      </button>
      </nav>
    </div>
  </div>
</body>

</html>
